    <circle cx="103" cy="82" r="4" fill="#9df3d0"/>
    <text x="119" y="88" font-size="13" letter-spacing="2" fill="#c3f6e2">RESEARCH IN PROGRESS</text>
    <text x="78" y="227" font-size="114" font-weight="700" letter-spacing="-5" fill="#f1fbf7">SoftSpace</text>
    <text x="84" y="285" font-size="30" fill="#bce6da">Comfort starts with the details.</text>
    <text x="84" y="342" font-size="19" fill="#9bbcb8">Exploring affordable passive headphones and glasses-friendly</text>
    <text x="84" y="372" font-size="19" fill="#9bbcb8">replacement cushions for people in India.</text>
    <path d="M84 423H740" stroke="#b8e4d6" stroke-opacity=".17"/>
    <text x="84" y="465" font-size="16" font-weight="700" fill="#a5efd4">01 / SOFTSPACE</text>
    <text x="84" y="492" font-size="15" fill="#9bbcb8">Standalone passive headphones</text>
    <text x="424" y="465" font-size="16" font-weight="700" fill="#f0cbb3">02 / SOFTSPACE FLEX</text>
    <text x="424" y="492" font-size="15" fill="#9bbcb8">Replacement cushions for glasses users</text>
    <g transform="translate(905 55)">
