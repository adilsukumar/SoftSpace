<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">SoftSpace research and design</title>
  <desc id="desc">SoftSpace and SoftSpace Flex, two comfort-focused headphone projects. Stylized concept illustration, not a manufactured product.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071720"/><stop offset="1" stop-color="#153b42"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#b4ffe2"/><stop offset="1" stop-color="#65bdb7"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#75e5c5" stop-opacity=".17"/><stop offset="1" stop-color="#75e5c5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a0e2d1" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="580" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="580" rx="28" fill="url(#grid)"/>
  <circle cx="1240" cy="267" r="325" fill="url(#halo)"/>
  <g font-family="Arial, Helvetica, sans-serif">
