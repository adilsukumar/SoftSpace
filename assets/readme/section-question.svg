ght="600" text-anchor="start">THE COMFORT QUESTION</text><text x="32" y="130" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Pressure, fit, surface feel, glasses and everyday use.</text><circle class="soft" cx="1086" cy="144" r="4" fill="#F3D962"/></svg>