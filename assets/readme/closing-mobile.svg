<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1235" viewBox="0 0 640 1235" role="img" aria-labelledby="t d"><title id="t">Comfort is the question. Evidence is the work. Decorative concept artwork. Physical validation remains ahead.</title><desc id="d">Decorative concept illustration, not V19 CAD geometry, an engineering simulation or a manufactured product.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes hinge{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.hinge{animation:hinge 12s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 15%}@keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}.soft{animation:soft 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.hinge,.soft{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 28H610" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="74" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">SOFTSPACE / SOFTSPACE FLEX</text><text x="32" y="190" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="56" font-weight="700" text-anchor="start">Comfort is the</text><text x="32" y="280" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="80" font-weight="600" text-anchor="start">question.</text><text x="32" y="378" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="42" font-weight="600" text-anchor="start">Evidence is the work.</text><g transform="translate(62 628) scale(1.16)"><path d="M48 245V160C48-25 404-25 404 160v85" fill="none" stroke="#A783F7" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 245V160C48-25 404-25 404 160v85" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M75 168C75 14 377 14 377 168" fill="none" stroke="#363348" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><g class="hinge" style="animation-delay:-0s"><rect x="25" y="184" width="78" height="160" rx="32" fill="#191726" stroke="#FF4081"/><rect x="43" y="198" width="43" height="131" rx="20" fill="#252135" stroke="#A783F7"/><path d="M62 218v91" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="hinge" style="animation-delay:-4s"><rect x="350" y="184" width="78" height="160" rx="32" fill="#191726" stroke="#BCFCF6"/><rect x="368" y="198" width="43" height="131" rx="20" fill="#252135" stroke="#A783F7"/><path d="M387 218v91" fill="none" stroke="#BCFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="soft"><path d="M139 249h60v43h-60zM254 249h60v43h-60zM199 258q28-20 55 0" fill="none" stroke="#F3D962" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 249l-12-23M314 249l12-23" fill="none" stroke="#F3D962" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="226" y="395" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">CONCEPT ART / SEE CAD FOR GEOMETRY</text></g><text x="32" y="1190" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">DESIGNED AROUND A PERSON. DOCUMENTED WITH CARE.</text></svg>