<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1490" viewBox="0 0 640 1490" role="img" aria-labelledby="t d"><title id="t">SoftSpace and SoftSpace Flex. A comfort question. An open investigation. Decorative concept artwork, not CAD motion.</title><desc id="d">Decorative concept illustration, not V19 CAD geometry, an engineering simulation or a manufactured product.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes hinge{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.hinge{animation:hinge 12s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 15%}@keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}.soft{animation:soft 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.hinge,.soft{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 28H610" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="73" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">ADIL SUKUMAR / PRODUCT DESIGN RESEARCH</text><text x="28" y="229" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="80" font-weight="700" text-anchor="start">SOFTSPACE</text><text x="32" y="303" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">SOFTSPACE + SOFTSPACE FLEX</text><text x="32" y="418" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="47" font-weight="600" text-anchor="start">A comfort question.</text><text x="32" y="493" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="42" font-weight="600" text-anchor="start">An open investigation.</text><text x="32" y="582" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Exploring passive headphones and</text><text x="32" y="616" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">glasses-friendly cushions, with</text><text x="32" y="650" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">evidence kept close.</text><g transform="translate(68 829) scale(1.15)"><path d="M48 245V160C48-25 404-25 404 160v85" fill="none" stroke="#A783F7" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 245V160C48-25 404-25 404 160v85" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M75 168C75 14 377 14 377 168" fill="none" stroke="#363348" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><g class="hinge" style="animation-delay:-0s"><rect x="25" y="184" width="78" height="160" rx="32" fill="#191726" stroke="#FF4081"/><rect x="43" y="198" width="43" height="131" rx="20" fill="#252135" stroke="#A783F7"/><path d="M62 218v91" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="hinge" style="animation-delay:-4s"><rect x="350" y="184" width="78" height="160" rx="32" fill="#191726" stroke="#BCFCF6"/><rect x="368" y="198" width="43" h